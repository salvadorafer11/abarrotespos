# Tema del tablero: informe formal (papel marfil, tinta azul marino y acento de latón).
# Se lee al correr `streamlit run tablero/app.py` desde la raiz del repositorio.
[theme]
base = "light"
primaryColor = "#10243F"
backgroundColor = "#E1E7F0"
secondaryBackgroundColor = "#EEF2F7"
textColor = "#283244"
borderColor = "#E6E2D9"
font = "sans-serif"

[client]
# Oculta la barra de herramientas de Streamlit (boton "Deploy") para que el tablero se vea limpio.
toolbarMode = "minimal"
